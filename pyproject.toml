[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "context-guardian-core"
version = "0.1.1"
description = "A human-in-the-loop control layer for AI agent context compaction."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Context Guardian Contributors" }]
keywords = ["ai-agent", "context-compaction", "human-in-the-loop", "memory", "pi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
openai = ["openai>=1.40,<2"]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "build>=1.2,<2",
]

[project.scripts]
context-guardian = "context_guardian.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["context_guardian"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.coverage",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/.venv313",
  "/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
