name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=context_guardian
      - run: ruff check .

  pi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
        working-directory: .
      - run: npm install
      - run: npm run typecheck
      - run: npm run smoke

  deepseek-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: npm install
      - run: npm run typecheck:dsh
      - run: npm run test:dsh

  claude-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: npm run claude-fixture-smoke
      - run: python -m json.tool .claude-plugin/marketplace.json >/dev/null

  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: npm run codex-fixture-smoke
      - run: python -m json.tool .agents/plugins/marketplace.json >/dev/null
