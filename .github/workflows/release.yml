name: Publish packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package set to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - python
          - python-and-deepseek-harness
          - pi
          - deepseek-harness

permissions:
  contents: read

jobs:
  python:
    if: ${{ inputs.package == 'all' || inputs.package == 'python' || inputs.package == 'python-and-deepseek-harness' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: python
    # Keep standalone npm releases possible when the Python job is skipped, but
    # publish npm packages only after Python succeeds for an all-package release.
    if: >-
      ${{ always() && ((inputs.package == 'all' && needs.python.result == 'success') ||
      inputs.package == 'pi' || inputs.package == 'deepseek-harness' ||
      (inputs.package == 'python-and-deepseek-harness' && needs.python.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # npm Trusted Publishing requires npm 11.5.1 or newer.
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:dsh
      - run: npm run test:dsh
      # Authentication is provided by GitHub OIDC after each package is configured
      # with this repository's npm Trusted Publisher relationship.
      - name: Publish Pi package
        if: ${{ inputs.package == 'all' || inputs.package == 'pi' }}
        run: npm publish --workspace adapters/pi --access public
      - name: Publish DeepSeek Harness package
        if: ${{ inputs.package == 'all' || inputs.package == 'deepseek-harness' || inputs.package == 'python-and-deepseek-harness' }}
        run: npm publish --workspace adapters/deepseek-harness --access public
